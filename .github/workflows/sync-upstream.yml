name: Sync Upstream

on:
  schedule:
    # 每天北京时间早上 8 点 (UTC 00:00)
    - cron: '0 0 * * *'
  workflow_dispatch:

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Configure Git
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

      - name: Add upstream remote
        run: |
          git remote add upstream https://github.com/dyndynjyxa/aio-coding-hub.git
          git fetch upstream

      - name: Sync main branch (fast-forward only)
        run: |
          git checkout main
          git merge --ff-only upstream/main
          git push origin main

      - name: Sync fork-base branch (rebase on upstream)
        run: |
          git checkout fork-base
          git rebase upstream/main || {
            echo "Rebase failed. Manual intervention needed for fork-base."
            git rebase --abort
            exit 1
          }
          git push --force-with-lease origin fork-base

      - name: Sync other branches (optional)
        if: false
        run: |
          # 如需同步其他分支，取消上面 if: false 并在此添加
          echo "Optional branch sync skipped"
